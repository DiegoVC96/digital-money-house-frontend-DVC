services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-dmh-frontend}:${IMAGE_TAG:-latest}
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
